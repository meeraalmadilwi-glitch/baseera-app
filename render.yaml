databases:
  - name: baseera-db
    databaseName: baseera_db
    user: baseera_user
    plan: free

services:
  - type: web
    name: baseera-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn baseera_web.wsgi:application --workers 4 --worker-class gthread --threads 4"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baseera-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
